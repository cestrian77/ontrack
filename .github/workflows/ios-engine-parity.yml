name: iOS engine goldens (Swift)

on:
  push:
    paths:
      - "fixtures/engine-goldens/**"
      - "ios/OnTrackEngine/**"
      - ".github/workflows/ios-engine-parity.yml"
  pull_request:
    paths:
      - "fixtures/engine-goldens/**"
      - "ios/OnTrackEngine/**"
      - "src/engine/**"
      - ".github/workflows/ios-engine-parity.yml"

jobs:
  swift-goldens:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift test (golden JSON contract)
        run: cd ios/OnTrackEngine && swift test
